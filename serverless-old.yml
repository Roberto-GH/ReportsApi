service: reports-api

provider:
  name: aws
  region: us-east-1
  stage: ${opt:stage, 'dev'}

resources:
  Resources:
    # --- Log Group para el servicio ---
    LogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /ecs/reports-api

    # --- Target Group y Listener Rule para el ALB ---
    TargetGroup:
      Type: AWS::ElasticLoadBalancingV2::TargetGroup
      Properties:
        Name: tg-reports-api
        VpcId: !ImportValue Crediya-VpcId
        Port: 8080
        Protocol: HTTP
        TargetType: ip
        HealthCheckEnabled: true
        HealthCheckPath: /actuator/health
        HealthCheckIntervalSeconds: 30

    ListenerRule:
      Type: AWS::ElasticLoadBalancingV2::ListenerRule
      Properties:
        ListenerArn:
          Fn::ImportValue: Crediya-ALBListenerArn
        Priority: 3
        Actions:
          - Type: forward
            TargetGroupArn:
              Ref: TargetGroup
        Conditions:
          - Field: path-pattern
            Values:
              - "/reports*"

    # --- Grupo de Seguridad ---
    EcsServiceSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupName: EcsServiceSecurityGroup-reports
        GroupDescription: "Allow traffic from ALB to Reports Service"
        VpcId: !ImportValue Crediya-VpcId
        SecurityGroupIngress:
          - SourceSecurityGroupId:
              Fn::ImportValue: Crediya-ALBSecurityGroupId
            IpProtocol: tcp
            FromPort: 8080
            ToPort: 8080
        SecurityGroupEgress:
          - Description: "Allow traffic to RDS"
            DestinationSecurityGroupId:
              Fn::ImportValue: Crediya-RDSSecurityGroupId
            IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432

    # --- Task Definition y Servicio de ECS ---
    TaskDefinition:
      Type: AWS::ECS::TaskDefinition
      Properties:
        Family: reports-api-task
        NetworkMode: awsvpc
        RequiresCompatibilities:
          - FARGATE
        Cpu: "256"
        Memory: "512"
        ExecutionRoleArn:
          Fn::ImportValue: Crediya-EcsExecutionRoleArn
        TaskRoleArn:
          Ref: EcsTaskRole
        ContainerDefinitions:
          - Name: container-reports-api
            Image: ${opt:imageUri, 'placeholder'}
            PortMappings:
              - ContainerPort: 8080
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: !Ref LogGroup
                awslogs-region: ${self:provider.region}
                awslogs-stream-prefix: ecs
            Secrets:
              - Name: JWT_SECRET_KEY
                ValueFrom: !Join [':', [!ImportValue Crediya-CrediyaSecretsArn, 'JWT_SECRET_KEY']]
            Environment:
              - Name: DYNAMO_DB_HOST
                Value: "" # En AWS, el SDK usa el endpoint regional, no se necesita host
              - Name: AUTH_API_URL
                Value: "http://authentication-api.local:8080"
              - Name: QUEUE_URL_LISTENER_REPORT
                Value: !ImportValue Crediya-QueueCrediyaReportsUrl
              - Name: SPRING_PROFILES_ACTIVE
                Value: pdn

    EcsService:
      Type: AWS::ECS::Service
      Properties:
        ServiceName: reports-api-service
        Cluster:
          Fn::ImportValue: Crediya-EcsClusterName
        TaskDefinition:
          Ref: TaskDefinition
        LaunchType: FARGATE
        DesiredCount: 1
        NetworkConfiguration:
          AwsvpcConfiguration:
            Subnets:
              - !ImportValue Crediya-PrivateSubnetA
              - !ImportValue Crediya-PrivateSubnetB
            SecurityGroups:
              - Ref: EcsServiceSecurityGroup
        LoadBalancers:
          - ContainerName: container-reports-api
            ContainerPort: 8080
            TargetGroupArn:
              Ref: TargetGroup
        ServiceConnectConfiguration:
          Enabled: true
          Namespace: crediya-namespace
        DeploymentConfiguration:
          DeploymentCircuitBreaker:
            Enable: true
            Rollback: true
          MaximumPercent: 200
          MinimumHealthyPercent: 100

    # --- IAM Role específico para este servicio ---
    EcsTaskRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: EcsTaskRole-reports-api
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - ecs-tasks.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: "reports-task-policy"
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: ["secretsmanager:GetSecretValue"]
                  Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:crediya/*"
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                    - dynamodb:Query
                    - dynamodb:Scan
                  Resource: !ImportValue Crediya-ReportsTableArn

    # --- API Gateway V2 Resources ---
    # Definir el HTTP API Gateway explícitamente
    HttpApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: ${self:service}-${self:provider.stage}-http-api
        ProtocolType: HTTP
        # Si necesitas CORS, configúralo aquí
        CorsConfiguration:
          AllowOrigins:
            - '*'
          AllowHeaders:
            - 'Content-Type'
            - 'X-Amz-Date'
            - 'Authorization'
            - 'X-Api-Key'
            - 'X-Amz-Security-Token'
            - 'X-Amz-User-Agent'
            - 'X-Amzn-Trace-Id'
          AllowMethods:
            - 'ANY'
          AllowCredentials: true
          MaxAge: 600

    # Definir la integración HTTP_PROXY para el ALB
    ReportsApiIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref HttpApi
        Description: 'HTTP Proxy Integration for Reports API'
        IntegrationType: HTTP_PROXY
        IntegrationMethod: ANY
        IntegrationUri: !ImportValue Crediya-ALBListenerArn
        ConnectionId: !ImportValue Crediya-VpcLinkId
        ConnectionType: VPC_LINK
        PayloadFormatVersion: '1.0' # O '2.0'
        TimeoutInMillis: 30000

    # Definir la ruta para el API Gateway
    ReportsApiRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref HttpApi
        RouteKey: 'ANY /reports/{proxy+}'
        Target: !Join ['', ['integrations/', !Ref ReportsApiIntegration]]

    # Definir el Stage del API Gateway
    HttpApiStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        ApiId: !Ref HttpApi
        StageName: ${self:provider.stage}
        AutoDeploy: true
        # AccessLogSettings: # Opcional: Configuración de logs de acceso
        #   DestinationArn: !GetAtt LogGroup.Arn
        #   Format: '{"requestId":"$context.requestId", "ip":"$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "routeKey":"$context.routeKey", "status":"$context.status", "protocol":"$context.protocol", "responseLength":"$context.responseLength"}'

  Outputs:
    HttpApiUrl:
      Description: "URL of the HTTP API Gateway"
      Value: !GetAtt HttpApi.ApiEndpoint
      Export:
        Name: ${self:service}-${self:provider.stage}-HttpApiUrl