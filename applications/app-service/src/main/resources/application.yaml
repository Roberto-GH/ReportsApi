server:
  port: 8070
spring:
  application:
    name: "ReportsApi"
  devtools:
    add-properties: false
logging:
  level:
    org:
      springframework:
        web: "DEBUG"
      boot:
        actuate: "TRACE"
aws:
  region: "us-east-1"
  jwtSecretName: "${JWT_SECRET_NAME}"
  dynamodb:
    endpoint: "http://localhost:1234"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ALWAYS
cors:
  allowed-origins: "${CORS}"
routes:
  report:
    paths:
      reports: "/api/v1/report"
entrypoint:
  sqs:
    region: "${AWS_REGION}"
    queueUrl: "${QUEUE_URL_LISTENER_REPORT}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
